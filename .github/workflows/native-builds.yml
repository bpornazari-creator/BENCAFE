name: Native mobile trial builds

on:
  workflow_dispatch:
  push:
    branches: [expo-starter]

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Locate Android SDK and install packages
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK root: $SDK_ROOT"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 5 -type d -print | head -80
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: bankcafe-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: iOS simulator build
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Select and verify Xcode 26 toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          swift --version
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - name: Install dependencies
        run: npm install
      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --non-interactive
      - name: Install CocoaPods
        run: |
          cd ios
          pod install
      - name: Build iOS simulator app
        run: |
          cd ios
          xcodebuild -list -workspace *.xcworkspace
          SCHEME="$(xcodebuild -list -workspace *.xcworkspace | sed -n '/Schemes:/,$p' | sed -n '2{s/^[[:space:]]*//;p;q;}')"
          test -n "$SCHEME"
          xcodebuild -workspace *.xcworkspace -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package iOS simulator app
        run: |
          cd ios/build/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/bankcafe-ios-simulator.zip" *.app
      - name: Upload iOS simulator build
        uses: actions/upload-artifact@v4
        with:
          name: bankcafe-ios-simulator
          path: bankcafe-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
