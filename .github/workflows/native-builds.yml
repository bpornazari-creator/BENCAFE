name: Native mobile trial builds

on:
  workflow_dispatch:
  push:
    branches: [expo-starter]

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: bankcafe-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: iOS simulator build
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - name: Install dependencies
        run: npm install
      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --non-interactive
      - name: Install CocoaPods
        run: |
          cd ios
          pod install
      - name: Build iOS simulator app
        run: |
          cd ios
          xcodebuild -workspace *.xcworkspace -scheme bankcafe -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package iOS simulator app
        run: |
          cd ios/build/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/bankcafe-ios-simulator.zip" *.app
      - name: Upload iOS simulator build
        uses: actions/upload-artifact@v4
        with:
          name: bankcafe-ios-simulator
          path: bankcafe-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
