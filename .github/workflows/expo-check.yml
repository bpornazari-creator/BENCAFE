name: Expo project checks

on:
  push:
    branches: [expo-starter]
  pull_request:
    branches: [expo-starter]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - name: Install dependencies
        run: npm install
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Validate Expo configuration
        run: npx expo config --type public
      - name: Check project health
        run: npx expo-doctor
      - name: Export Android, iOS, and web bundles
        run: npx expo export --platform all
      - name: Save web preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: bankcafe-web-preview
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Package GitHub Pages preview
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy-preview:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish temporary web preview
        id: deployment
        uses: actions/deploy-pages@v4
