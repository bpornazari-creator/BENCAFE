name: Expo project checks

on:
  push:
    branches: [expo-starter]
  pull_request:
    branches: [expo-starter]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - name: Install dependencies
        run: npm install
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Validate Expo configuration
        run: npx expo config --type public
      - name: Check project health
        run: npx expo-doctor
      - name: Export Android, iOS, and web bundles
        run: npx expo export --platform all
      - name: Save web preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: bankcafe-web-preview
          path: dist/
          if-no-files-found: error
          retention-days: 14
